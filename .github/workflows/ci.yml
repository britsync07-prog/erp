name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Tests create their own throwaway SQLite files (tests/integration/* run
      # `prisma db push` against file: URLs), so this value is only a placeholder
      # to keep the Prisma CLI happy. It is NOT a credential.
      DATABASE_URL: "file:./prisma/ci.db"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # No Postgres service container: every test file provisions an isolated
      # SQLite database itself. Add a `services: postgres:` block here only if a
      # future test suite requires a real PostgreSQL connection.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build failure artefacts
        if: failure()
        run: ls -la .next 2>/dev/null || echo "no .next output"
